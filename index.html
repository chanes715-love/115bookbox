<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>長安國小書箱資源庫</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Google Fonts: Noto Sans TC (無襯線) 與 Noto Serif TC (宋體/襯線) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #C1E1B9; /* 淺綠色背景 */
            background-image: 
                radial-gradient(circle at 15% 10%, #A8D19D 0%, transparent 30%),
                radial-gradient(circle at 85% 90%, #A8D19D 0%, transparent 30%);
            background-attachment: fixed;
        }
        .serif-title {
            font-family: 'Noto Serif TC', serif;
        }
        /* 書櫃單層的樣式設計 */
        .shelf-row {
            position: relative;
            padding-bottom: 20px;
            border-bottom: 25px solid #8c603f; /* 木板厚度 */
            box-shadow: inset 0 -5px 10px rgba(0,0,0,0.3), 0 5px 10px rgba(0,0,0,0.2);
            margin-bottom: 40px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            min-height: 250px;
        }
        .shelf-row::before {
            content: '';
            position: absolute;
            bottom: -25px;
            left: -10px;
            right: -10px;
            height: 25px;
            background: linear-gradient(to bottom, #724c30, #5c3c24);
            z-index: 1;
            border-radius: 3px;
        }
        .shelf-row::after {
            content: '';
            position: absolute;
            bottom: -35px;
            left: 0;
            right: 0;
            height: 10px;
            background: rgba(0,0,0,0.2);
            filter: blur(4px);
        }
        .book-item {
            z-index: 10;
            position: relative;
            bottom: -20px; /* 讓書本貼齊書架木板 */
        }
    </style>
</head>
<body class="min-h-screen flex flex-col text-gray-800 p-4 md:p-8">
    
    <div class="max-w-6xl mx-auto w-full flex-grow flex flex-col">
        
        <!-- Header 區塊：標題與連結 -->
        <header class="text-center mt-2 md:mt-4 mb-6 flex flex-col items-center">
            <div class="flex items-center justify-center gap-3 md:gap-4 mb-2">
                <!-- 可愛書本圖示 -->
                <svg class="w-16 h-16 md:w-20 md:h-20 transition-transform hover:scale-110 hover:-rotate-3 drop-shadow-md" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- 書皮 -->
                    <path d="M50 85L15 75V25L50 35L85 25V75L50 85Z" fill="#B06B1A"/>
                    <!-- 書頁 -->
                    <path d="M50 80L20 71V23L50 31L80 23V71L50 80Z" fill="#FFF8E7"/>
                    <!-- 紅色書籤 -->
                    <path d="M42 28V10H58V32L50 28L42 28Z" fill="#CC4B40"/>
                    <!-- 左側文字線條 -->
                    <path d="M28 45H40M28 55H40M28 65H40" stroke="#D4C4A8" stroke-width="3" stroke-linecap="round"/>
                    <!-- 右側笑臉 -->
                    <circle cx="63" cy="55" r="2.5" fill="#4A3B32"/>
                    <circle cx="73" cy="55" r="2.5" fill="#4A3B32"/>
                    <path d="M65 58 Q 68 61 71 58" stroke="#4A3B32" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                    <circle cx="60" cy="58" r="3" fill="#FFAAA5" opacity="0.7"/>
                    <circle cx="76" cy="58" r="3" fill="#FFAAA5" opacity="0.7"/>
                </svg>
                
                <h1 class="text-4xl md:text-5xl font-black text-[#1F3A4A] tracking-wider serif-title drop-shadow-sm">
                    長安國小書箱資源庫
                </h1>
            </div>
            
            <!-- 長安圖書系統外部連結 -->
            <a href="https://read.moe.edu.tw/193661/library" target="_blank" rel="noopener noreferrer" 
               class="mt-1 flex items-center justify-center gap-2 text-xl md:text-2xl font-bold text-[#B06B1A] hover:text-[#CC4B40] transition-colors group">
                <span class="border-b-[3px] border-[#B06B1A] group-hover:border-[#CC4B40] pb-1 transition-colors">長安圖書系統</span>
                <svg class="w-5 h-5 md:w-6 md:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                </svg>
            </a>
        </header>

        <!-- 搜尋列區塊 -->
        <div class="w-full max-w-2xl mx-auto mb-8">
            <form id="searchForm" class="relative flex items-center bg-white rounded-full shadow-lg border-[3px] border-white overflow-hidden focus-within:border-[#E8A343] transition-colors">
                <div class="pl-4 md:pl-5 text-[#86A87A]">
                    <svg class="w-5 h-5 md:w-6 md:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                <input type="text" id="searchInput" placeholder="輸入書箱登錄號 或 關鍵字..." 
                       class="w-full py-2.5 md:py-3 px-3 text-sm md:text-base text-gray-700 font-bold focus:outline-none placeholder-[#86A87A]">
                <button type="submit" class="bg-[#E8A343] hover:bg-[#d89232] text-[#2A433A] font-black text-sm md:text-base py-2.5 md:py-3 px-6 md:px-8 h-full transition-colors">
                    SEARCH
                </button>
            </form>
        </div>

        <!-- 主要內容區塊 -->
        <main class="w-full max-w-5xl mx-auto flex-grow flex flex-col pt-4">
            
            <!-- 載入中動畫 (預設顯示) -->
            <div id="loading" class="flex flex-col items-center justify-center py-20">
                <svg class="animate-spin h-12 w-12 mb-4 text-[#B06B1A]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <p class="text-xl font-bold text-[#2A433A] tracking-wider">書箱資料載入中，請稍候...</p>
            </div>

            <!-- 書櫃容器 (預設隱藏) -->
            <div id="book-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-8 hidden">
                <!-- 書籍卡片將由 JavaScript 動態生成在這裡 -->
            </div>

            <!-- 分頁按鈕區塊 (預設隱藏) -->
            <div id="pagination" class="flex justify-center mt-10 mb-8 hidden">
                <button id="next-page-btn" class="bg-[#CC4B40] hover:bg-[#a83a31] text-white font-bold py-3 px-8 rounded-full shadow-md transition transform hover:-translate-y-1">
                    隨機顯示下一頁 ➯
                </button>
            </div>
            
        </main>
    </div>

    <!-- JavaScript 邏輯 -->
    <script>
        // ==========================================
        // !!! 請在此處貼上您最新部署的 GAS 網址 !!!
        // ==========================================
        const GAS_URL = '請替換成您的_GAS_Web_App_URL'; 
        
        let allBooks = [];
        let filteredBooks = [];
        let currentPage = 1;
        const booksPerPage = 10;

        // 步驟 1: 非同步從 GAS 讀取資料
        async function fetchData() {
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('book-container').classList.add('hidden');
            document.getElementById('pagination').classList.add('hidden');

            try {
                const response = await fetch(GAS_URL);
                allBooks = await response.json();
                
                // 載入成功，隱藏動畫，顯示書櫃
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('book-container').classList.remove('hidden');
                
                resetAndDisplayRandom();
            } catch (error) {
                console.error('資料讀取錯誤:', error);
                document.getElementById('loading').innerHTML = '<p class="text-red-500 text-xl font-bold">載入失敗，請檢查您的 GAS 網址或網路連線。</p>';
            }
        }

        // 洗牌演算法 (Fisher-Yates Shuffle) 用於隨機打亂書籍
        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // 渲染書籍卡片到書櫃上
        function renderBooks(booksToDisplay) {
            const container = document.getElementById('book-container');
            container.innerHTML = '';

            if (booksToDisplay.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-12 text-[#2A433A]">
                        <svg class="w-16 h-16 mx-auto mb-4 text-[#86A87A]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <p class="text-xl font-bold">找不到相符的書箱，請嘗試其他關鍵字。</p>
                    </div>`;
                return;
            }

            booksToDisplay.forEach(book => {
                const card = document.createElement('div');
                card.className = 'shelf-row group';

                card.innerHTML = `
                    <div class="book-item bg-white p-5 rounded-t-xl rounded-bl-xl shadow-lg border-2 border-[#86A87A] transition transform hover:-translate-y-2 hover:shadow-xl mx-4 flex flex-col h-full bg-opacity-95">
                        <div class="flex items-center justify-between mb-3 border-b-2 border-dashed border-[#A8D19D] pb-3">
                            <span class="bg-[#E8A343] text-white px-3 py-1 rounded-full text-sm font-black shadow-sm">${book.id}</span>
                            <a href="${book.descLink}" target="_blank" rel="noopener noreferrer" class="text-[#CC4B40] hover:text-[#a83a31] bg-[#FFF8E7] p-2 rounded-full transition-colors" title="查看書箱描述連結">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                            </a>
                        </div>
                        <h2 class="text-xl font-bold text-[#1F3A4A] mb-3 leading-snug flex-grow serif-title">${book.name}</h2>
                        ${book.note ? `<p class="text-[#4A3B32] text-sm bg-[#F4F9F2] p-3 rounded-lg border border-[#C1E1B9]"><span class="font-bold text-[#86A87A]">說明：</span>${book.note}</p>` : ''}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 處理分頁顯示
        function displayCurrentPage() {
            const startIndex = (currentPage - 1) * booksPerPage;
            const endIndex = startIndex + booksPerPage;
            const booksToDisplay = filteredBooks.slice(startIndex, endIndex);
            
            renderBooks(booksToDisplay);

            // 判斷是否需要顯示「下一頁」按鈕
            if (endIndex < filteredBooks.length) {
                document.getElementById('pagination').classList.remove('hidden');
            } else {
                document.getElementById('pagination').classList.add('hidden');
            }
        }

        // 重新打亂並回到第一頁 (用於沒有搜尋關鍵字時)
        function resetAndDisplayRandom() {
            filteredBooks = shuffleArray([...allBooks]); // 複製一份並打亂
            currentPage = 1;
            displayCurrentPage();
        }

        // 監聽搜尋表單提交事件
        document.getElementById('searchForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();

            if (keyword === "") {
                resetAndDisplayRandom();
                return;
            }

            // 根據關鍵字過濾登錄號或書名
            filteredBooks = allBooks.filter(book => {
                return (book.id && book.id.toLowerCase().includes(keyword)) ||
                       (book.name && book.name.toLowerCase().includes(keyword));
            });

            currentPage = 1; // 搜尋後回到第一頁
            displayCurrentPage();
        });

        // 監聽「下一頁」按鈕點擊事件
        document.getElementById('next-page-btn').addEventListener('click', function() {
            currentPage++;
            displayCurrentPage();
            // 自動平滑滾動回畫面較上方，方便閱讀
            window.scrollTo({
                top: document.getElementById('searchForm').offsetTop - 20,
                behavior: 'smooth'
            });
        });

        // 網頁載入完成後自動執行抓取資料
        window.onload = fetchData;
    </script>
</body>
</html>
